---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "rssbridge_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required RSS-Bridge settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - rssbridge_uid
    - rssbridge_gid
    - rssbridge_hostname
    - rssbridge_path_prefix
    - rssbridge_container_network

- name: Run if Traefik is enabled
  when: rssbridge_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for RSS-Bridge are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "rssbridge_container_labels_traefik_hostname", when: true }
        - { "name": "rssbridge_container_labels_traefik_path_prefix", when: true }
        - { "name": "rssbridge_container_labels_traefik_middleware_basic_auth_users", when: "{{ rssbridge_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `rssbridge_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if rssbridge_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          rssbridge_container_labels_traefik_path_prefix (`{{ rssbridge_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/rssbridge`).
      when: "rssbridge_container_labels_traefik_path_prefix != '/' and rssbridge_container_labels_traefik_path_prefix[-1] == '/'"
