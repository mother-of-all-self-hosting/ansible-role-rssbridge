---
- name: Include roles for RSS-Bridge Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for RSS-Bridge Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure RSS-Bridge service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    # A playbook consuming this role leaves the restarting to the systemd
    # service manager role, which acts on `rssbridge_restart_necessary`. There
    # is no such role here, so the same decision is made inline - otherwise a
    # second converge against changed configuration would leave the container
    # running the configuration it started with, and the verification would be
    # inspecting a stale process. RSS-Bridge boots in a second and runs no
    # migrations, so restarting it costs nothing.
    - name: Ensure RSS-Bridge systemd service is started
      ansible.builtin.systemd_service:
        name: rssbridge.service
        state: "{{ 'restarted' if rssbridge_restart_necessary | bool else 'started' }}"
