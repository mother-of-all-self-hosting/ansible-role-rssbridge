---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: rssbridge-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        rssbridge_debug_service_enabled: false

        # The container name the role derives from its identifier.
        # Role defaults are not in scope in a verify play, so it is spelled out.
        rssbridge_molecule_container: rssbridge

        # Where the role clones RSS-Bridge to, and the image name it builds -
        # both derived by the role from `rssbridge_base_path` and
        # `rssbridge_version`. `latest` is not a git ref, so the role builds
        # from `master`; spelled out here because the verify play cannot
        # evaluate the role's Jinja to work them out.
        rssbridge_molecule_selfbuild_src_path: /rssbridge/docker-src
        rssbridge_molecule_selfbuild_image: rssbridge/rss-bridge:master

        # See molecule/default/molecule.yml for what the feed fixture is for.
        rssbridge_molecule_feed_fixture_host_path: /var/lib/mash-molecule-rssbridge/molecule-feed.xml
        rssbridge_molecule_feed_fixture_container_path: /app/static/molecule-feed.xml
        rssbridge_molecule_feed_fixture_channel_title: MASH Molecule Fixture Feed
        rssbridge_molecule_feed_fixture_item_title: MASH Molecule fixture item

        # Variables for RSS-Bridge
        rssbridge_uid: "0"
        rssbridge_gid: 33
        rssbridge_scheme: http
        rssbridge_hostname: localhost
        rssbridge_container_labels_traefik_enabled: false
        rssbridge_container_http_host_bind_port: 127.0.0.1:8080

        # RSS-Bridge's entrypoint rewrites the port nginx listens on to
        # whatever HTTP_PORT says, so this pair is only consistent if the env
        # file the role renders actually reached the container. Left to itself
        # the image listens on 80, and every probe below would be refused.
        rssbridge_container_http_port: 8081
        rssbridge_environment_variables_additional_variables: |
          HTTP_PORT=8081

        rssbridge_environment_variables_tz: Europe/Sofia

        # Deliberately different from the values the `default` scenario uses:
        # if the two scenarios ever start sharing state, the wrong credentials
        # will be the first thing to say so.
        rssbridge_config_authentication_enable: true
        rssbridge_config_authentication_username: mash-molecule-selfbuild
        rssbridge_config_authentication_password: mash-molecule-selfbuild-secret

        rssbridge_config_additional_configurations: |
          [system]
          message = "MASH Molecule RSS-Bridge (self-built)"

        rssbridge_container_additional_volumes_custom:
          - type: bind
            src: /var/lib/mash-molecule-rssbridge/molecule-feed.xml
            dst: /app/static/molecule-feed.xml
            options: readonly

        # Test self-building
        rssbridge_container_image_self_build: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
